name: Release

# Builds, signs and publishes the version in VERSION: GitHub release (zip + dmg) and appcast.xml on main.
# Needs the secrets set by scripts/setup-release-secrets.sh.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Sparkle channel
        type: choice
        options: [stable, beta]
        default: beta

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # build number = commit count, release notes since the last tag

      - name: Check version
        run: |
          version=$(cat VERSION)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released: bump VERSION first"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The same self-signed identity as local builds: macOS permissions and Sparkle's signature check rely on it.
      - name: Import signing identity
        env:
          CERT_P12: ${{ secrets.REDOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.REDOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/redos.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/redos.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/redos.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "RedOS Development" -p "$keychain" > "$RUNNER_TEMP/redos.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain \
            "$RUNNER_TEMP/redos.pem"
          rm "$RUNNER_TEMP/redos.p12"
          security find-identity -p codesigning "$keychain"

      - name: Sparkle key
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          umask 077
          printf '%s' "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/sparkle.key"
          echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"

      - name: Package
        run: make release CHANNEL=${{ inputs.channel == 'beta' && 'beta' || '' }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          make publish CHANNEL=${{ inputs.channel == 'beta' && 'beta' || '' }}

      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/sparkle.key"
          security delete-keychain "$RUNNER_TEMP/redos.keychain-db" 2>/dev/null || true
